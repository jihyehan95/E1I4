<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1" name="viewport" />
<title>문서 생성 담당자 호출</title>
<style>
  :root{
    --bg:#f6f8fb;
    --panel:#ffffff;
    --line:#e4e8ef;
    --text:#1f2937;
    --muted:#6b7280;
    --primary:#2563eb;
    --shadow:0 10px 30px rgba(31,41,55,.08);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  main{
    padding:34px 34px 60px;
    max-width:1100px;
    width:100%;
    margin:0 auto;
  }
  .hero{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:#fff;
    border-radius:22px;
    padding:26px 30px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
  }
  .hero h1{margin:0 0 8px;font-size:24px}
  .hero p{margin:0;color:#d1d5db;line-height:1.6}
  .grid{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:18px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:22px;
  }
  .card h2{margin-top:0}
  .input-card{grid-column:span 5}
  .results-card{grid-column:span 7}
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  label{
    font-size:13px;
    color:#475569;
    font-weight:700;
    display:block;
    margin-bottom:6px;
  }
  input, textarea, select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d8dee8;
    border-radius:10px;
    background:#fff;
    font:inherit;
  }
  textarea{min-height:90px;resize:vertical}
  .full{grid-column:1/-1}
  .btn{
    border:0;
    background:var(--primary);
    color:#fff;
    font-weight:800;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    margin-top:14px;
  }
  .btn:disabled{opacity:.6;cursor:wait}
  .status-card{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .status-card .icon{
    width:42px;height:42px;border-radius:12px;
    display:grid;place-items:center;font-size:20px;
    background:#f5f0ff;
  }
  .status-card strong{display:block}
  .status-card small{color:var(--muted)}
  .status{
    margin-left:auto;
    font-size:12px;
    padding:6px 9px;
    border-radius:999px;
    font-weight:700;
    background:#eef2f7;
    color:#64748b;
  }
  .status-card.running .status{background:#dbeafe;color:#1d4ed8}
  .status-card.done .status{background:#dcfce7;color:#15803d}
  .status-card.error .status{background:#fee2e2;color:#b91c1c}
  .report-page{
    background:#fff;
    color:#111;
    border:1px solid #d8d8d8;
    border-radius:10px;
    padding:26px 28px;
    min-height:300px;
    font-family:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
    font-size:14px;
    line-height:1.7;
    white-space:pre-wrap;
  }
  .report-placeholder{color:var(--muted);font-family:inherit;white-space:normal}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<section class="hero">
<h1>문서 생성 담당 (Document Agent)</h1>
<p>일정·경비 등 데이터를 받아, 회사별 양식이 있으면 그 양식에 맞춰 출장 문서를 만듭니다. (5개 에이전트 중 이 화면은 문서 담당 하나만 실제로 연결되어 있습니다.)</p>
</section>

<section class="grid">
<div class="card input-card">
<h2>입력</h2>
<div class="field-grid">
<div><label>지역</label><input id="region" value="부산" /></div>
<div><label>인원</label><input id="people" type="number" value="2" /></div>
<div><label>시작일</label><input id="startDate" type="date" /></div>
<div><label>종료일</label><input id="endDate" type="date" /></div>
<div><label>예산</label><input id="budget" type="number" value="0" /></div>
<div><label>작성자</label><input id="author" value="" /></div>
<div class="full">
<label>목적</label>
<textarea id="purpose" placeholder="출장 목적을 입력하세요"></textarea>
</div>
<div class="full">
<label>일정·경비 등 세부 데이터</label>
<textarea id="details" rows="6" placeholder="확정된 일정, 방문지, 경비 내역 등 문서에 담을 내용을 자유롭게 적으세요"></textarea>
</div>
<div class="full">
<label for="template-file">회사별 양식 파일 (선택, 텍스트 형식 .txt/.md)</label>
<input type="file" id="template-file" accept=".txt,.md" />
</div>
</div>
<button class="btn" id="call-btn">문서 생성하기</button>
</div>

<div class="card results-card">
<h2>문서 담당 (Document Agent)</h2>
<div class="status-card" id="doc-status">
<div class="icon">📝</div>
<div>
<strong>문서 생성</strong>
<small>확정된 일정·경비를 받아 문서를 만듭니다</small>
</div>
<span class="status">대기</span>
</div>
<div class="report-page" id="result">
<span class="report-placeholder">아직 실행 전이에요. "문서 생성하기"를 누르면 결과가 여기에 표시됩니다.</span>
</div>
<p class="muted">※ 실제로 Anthropic API를 호출합니다. 비용이 발생할 수 있습니다.</p>
</div>
</section>
</main>

<script>
const btn = document.getElementById("call-btn");
const result = document.getElementById("result");
const statusCard = document.getElementById("doc-status");
const statusLabel = statusCard.querySelector(".status");
const templateFile = document.getElementById("template-file");

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

function setStatus(mode, label) {
  statusCard.classList.remove("running", "done", "error");
  if (mode) statusCard.classList.add(mode);
  statusLabel.textContent = label;
}

function buildDataText() {
  const fields = [
    ["지역", document.getElementById("region").value],
    ["인원", document.getElementById("people").value + "명"],
    ["기간", `${document.getElementById("startDate").value || "미정"} ~ ${document.getElementById("endDate").value || "미정"}`],
    ["예산", document.getElementById("budget").value + "원"],
    ["작성자", document.getElementById("author").value],
    ["목적", document.getElementById("purpose").value],
  ];
  const lines = fields.filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`);
  const details = document.getElementById("details").value.trim();
  if (details) lines.push("", "세부 데이터:", details);
  return lines.join("\n");
}

btn.addEventListener("click", async () => {
  const data = buildDataText();
  const file = templateFile.files[0];
  const template = file ? await readFileAsText(file) : "";

  result.textContent = "";
  result.innerHTML = '<span class="report-placeholder">부르는 중</span>';
  setStatus("running", "실행 중");
  btn.disabled = true;

  try {
    const res = await fetch("/call-agent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ data, template }),
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text || `오류 (${res.status})`);
    result.textContent = text;
    setStatus("done", "완료");
  } catch (err) {
    result.textContent = "오류: " + err.message;
    setStatus("error", "오류");
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
